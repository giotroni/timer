<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cronometro</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:  #7abfb2;
      --accent2: #5a9e8f;
      --green:   #009d62;
      --text:    #ffffff;
      --mid:     rgba(255,255,255,.45);
      --dim:     rgba(255,255,255,.15);
    }

    html, body {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #1e2e42 0%, #243d52 40%, #2a5c52 100%);
      font-family: 'Share Tech Mono', monospace;
      color: var(--text);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(122,191,178,.08) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.45) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Logo */
    .brand {
      position: fixed;
      top: clamp(14px, 2.8vh, 30px);
      right: clamp(16px, 3vw, 44px);
      z-index: 10;
      opacity: .75;
      transition: opacity .2s;
    }
    .brand:hover { opacity: 1; }
    .brand a { display: block; }
    .brand svg { width: clamp(110px, 13vw, 190px); height: auto; display: block; }
    .brand .st0 { fill: #ffffff; }
    .brand .st1 { fill: #009d62; }

    /* Mode switcher */
    .mode-switcher {
      display: flex;
      gap: 0;
      border: 1.5px solid var(--dim);
      border-radius: 4px;
      overflow: hidden;
    }
    .mode-btn {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(12px, 1.6vw, 16px);
      letter-spacing: .2em;
      padding: clamp(6px, 1vh, 10px) clamp(18px, 3vw, 36px);
      background: transparent;
      color: var(--mid);
      border: none;
      cursor: pointer;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-btn.active {
      background: var(--accent2);
      color: #fff;
    }
    .mode-btn:not(.active):hover {
      background: rgba(255,255,255,.07);
      color: var(--text);
    }

    /* Container */
    .container {
      position: relative; z-index: 1;
      width: 100%; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3.5vh, 40px);
    }

    .label {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(13px, 2vw, 20px);
      letter-spacing: .5em;
      color: var(--mid);
      text-transform: uppercase;
    }

    .line {
      width: clamp(40px, 8vw, 90px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .55;
    }

    /* Clock */
    .clock-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: .04em;
    }

    .digits {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(88px, 20vw, 240px);
      line-height: 1;
      letter-spacing: .02em;
      color: var(--text);
      text-shadow: 0 2px 40px rgba(0,0,0,.3);
      transition: text-shadow .2s, color .3s;
      user-select: none;
    }
    .digits.running {
      text-shadow: 0 0 20px rgba(122,191,178,.4), 0 0 60px rgba(122,191,178,.15), 0 2px 40px rgba(0,0,0,.3);
    }
    .digits.warning {
      color: #f0c060;
      text-shadow: 0 0 20px rgba(240,192,96,.5), 0 2px 40px rgba(0,0,0,.3);
    }
    .digits.danger {
      color: #e86060;
      text-shadow: 0 0 20px rgba(232,96,96,.6), 0 2px 40px rgba(0,0,0,.3);
      animation: shake .12s ease-in-out infinite;
    }
    .digits.finished { color: #e86060; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-3px); }
      75%      { transform: translateX(3px); }
    }

    .sep {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(72px, 16vw, 200px);
      line-height: 1;
      color: var(--accent);
      transition: opacity .1s, color .3s;
      animation: blink 1s step-start infinite;
      user-select: none;
    }
    .sep.paused  { animation: none; opacity: .25; }
    .sep.stopped { animation: none; opacity: .2; }
    .sep.warning { color: #f0c060; }
    .sep.danger  { color: #e86060; animation: blink .4s step-start infinite; }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .15; }
    }

    .millis {
      position: absolute;
      right: -4px;
      bottom: clamp(4px, 1.2vw, 14px);
      transform: translateX(100%);
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(20px, 3.5vw, 52px);
      color: var(--accent);
      opacity: .7;
      letter-spacing: .04em;
      user-select: none;
      transition: color .3s;
    }
    .millis.warning { color: #f0c060; }
    .millis.danger  { color: #e86060; }

    /* ── Countdown input ── */
    .countdown-setup {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.5vh, 16px);
    }
    .countdown-setup.visible { display: flex; }

    .setup-label {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(11px, 1.4vw, 15px);
      letter-spacing: .35em;
      color: var(--mid);
    }

    .time-inputs {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.2vw, 14px);
    }

    .time-field {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .time-field label {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(10px, 1.2vw, 13px);
      letter-spacing: .3em;
      color: var(--mid);
    }

    .time-input-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .arrow-btn {
      background: none;
      border: none;
      color: var(--mid);
      cursor: pointer;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1;
      padding: 2px 8px;
      transition: color .15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .arrow-btn:hover { color: var(--accent); }

    .time-val {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(36px, 8vw, 90px);
      line-height: 1;
      color: var(--text);
      width: clamp(60px, 10vw, 110px);
      text-align: center;
      background: rgba(255,255,255,.06);
      border: 1.5px solid var(--dim);
      border-radius: 4px;
      padding: 4px 0;
      cursor: default;
      user-select: none;
      transition: border-color .15s;
    }
    .time-val:focus-within,
    .time-val:hover { border-color: var(--accent); }

    /* Hidden native number input overlaid for direct typing */
    .time-val input {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
      pointer-events: none;
    }

    .colon-big {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(36px, 8vw, 90px);
      color: var(--accent);
      opacity: .6;
      line-height: 1;
      padding-bottom: clamp(26px,5vw,52px);
    }

    /* Buttons */
    .controls {
      display: flex;
      gap: clamp(12px, 3vw, 32px);
      align-items: center;
    }

    .btn {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(15px, 2.2vw, 24px);
      letter-spacing: .2em;
      border: none;
      cursor: pointer;
      padding: clamp(10px, 1.8vh, 18px) clamp(28px, 4.5vw, 56px);
      border-radius: 3px;
      transition: transform .1s, box-shadow .15s, filter .15s, background .15s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.95); }

    .btn-main {
      background: var(--accent2);
      color: #fff;
      box-shadow: 0 4px 24px rgba(90,158,143,.4), 0 2px 8px rgba(0,0,0,.3);
      min-width: clamp(120px, 18vw, 200px);
    }
    .btn-main:hover { filter: brightness(1.15); box-shadow: 0 4px 32px rgba(90,158,143,.6), 0 2px 8px rgba(0,0,0,.3); }
    .btn-main.stop {
      background: rgba(255,255,255,.15);
      border: 2px solid rgba(255,255,255,.35);
      color: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,.2);
    }
    .btn-main.stop:hover { background: rgba(255,255,255,.22); }
    .btn-main:disabled {
      opacity: .35;
      cursor: default;
      filter: none;
      box-shadow: none;
    }
    .btn-main:disabled:active { transform: none; }

    .btn-reset {
      background: transparent;
      border: 2px solid var(--dim);
      color: rgba(255,255,255,.6);
    }
    .btn-reset:hover { border-color: rgba(255,255,255,.4); color: var(--text); background: rgba(255,255,255,.06); }

    /* Status */
    .status {
      font-size: clamp(10px, 1.3vw, 13px);
      letter-spacing: .4em;
      color: var(--mid);
      text-transform: uppercase;
      height: 1.2em;
      transition: color .2s;
    }
    .status.running  { color: var(--accent); }
    .status.paused   { color: rgba(255,255,255,.55); animation: pulse 1.4s ease-in-out infinite; }
    .status.finished { color: #e86060; animation: pulse .7s ease-in-out infinite; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .35; }
    }

    /* ── Alarm flash overlay ── */
    #flashOverlay {
      position: fixed; inset: 0;
      z-index: 100;
      background: #e86060;
      opacity: 0;
      pointer-events: none;
    }
    #flashOverlay.flashing {
      animation: screenFlash 0.5s ease-in-out 3;
    }
    @keyframes screenFlash {
      0%   { opacity: 0; }
      45%  { opacity: .6; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="flashOverlay"></div>

<div class="container">

  <!-- Mode switcher -->
  <div class="mode-switcher">
    <button class="mode-btn active" id="btnModeStop">CRONOMETRO</button>
    <button class="mode-btn" id="btnModeCount">CONTO ALLA ROVESCIA</button>
  </div>

  <div class="label" id="mainLabel">Cronometro</div>
  <div class="line"></div>

  <!-- Countdown setup (hidden in stopwatch mode) -->
  <div class="countdown-setup" id="countdownSetup">
    <div class="setup-label">Imposta il tempo di partenza</div>
    <div class="time-inputs">
      <div class="time-field">
        <label>MIN</label>
        <div class="time-input-wrap">
          <button class="arrow-btn" id="minUp">▲</button>
          <div class="time-val" id="cdMinDisplay">05</div>
          <button class="arrow-btn" id="minDown">▼</button>
        </div>
      </div>
      <div class="colon-big">:</div>
      <div class="time-field">
        <label>SEC</label>
        <div class="time-input-wrap">
          <button class="arrow-btn" id="secUp">▲</button>
          <div class="time-val" id="cdSecDisplay">00</div>
          <button class="arrow-btn" id="secDown">▼</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Clock display -->
  <div class="clock-wrap">
    <span class="digits" id="minutes">00</span>
    <span class="sep" id="sep">:</span>
    <span class="digits" id="seconds">00</span>
    <span class="millis" id="millis">.00</span>
  </div>

  <div class="controls">
    <button class="btn btn-main" id="btnStart">START</button>
    <button class="btn btn-reset" id="btnReset">RESET</button>
  </div>

  <div class="status" id="status">— pronto —</div>
</div>

<script>
  // ─── State ───────────────────────────────────────────────
  let mode      = 'stopwatch'; // 'stopwatch' | 'countdown'
  let state     = 'stopped';   // 'stopped' | 'running'
  let startTime = 0;
  let elapsed   = 0;
  let timerID   = null;

  // Countdown settings (in ms)
  let cdMinutes = 5;
  let cdSeconds = 0;
  function cdTotal() { return (cdMinutes * 60 + cdSeconds) * 1000; }

  // ─── DOM refs ────────────────────────────────────────────
  const minEl    = document.getElementById('minutes');
  const secEl    = document.getElementById('seconds');
  const msEl     = document.getElementById('millis');
  const sepEl    = document.getElementById('sep');
  const btnStart = document.getElementById('btnStart');
  const btnReset = document.getElementById('btnReset');
  const statusEl = document.getElementById('status');
  const labelEl  = document.getElementById('mainLabel');
  const setupEl  = document.getElementById('countdownSetup');
  const cdMinDisp = document.getElementById('cdMinDisplay');
  const cdSecDisp = document.getElementById('cdSecDisplay');

  // ─── Helpers ─────────────────────────────────────────────
  const pad = (n, d=2) => String(n).padStart(d, '0');

  function render(ms) {
    if (ms < 0) ms = 0;
    const total = Math.floor(ms / 10);
    const cs = total % 100;
    const s  = Math.floor(total / 100) % 60;
    const m  = Math.floor(total / 6000);
    minEl.textContent = pad(m);
    secEl.textContent = pad(s);
    msEl.textContent  = '.' + pad(cs);
  }

  function setDigitClass(cls) {
    [minEl, secEl].forEach(el => {
      el.className = 'digits';
      if (cls) el.classList.add(cls);
    });
    msEl.className = 'millis' + (cls === 'warning' || cls === 'danger' ? ' ' + cls : '');
    sepEl.className = 'sep' + (cls === 'warning' || cls === 'danger' ? ' ' + cls : '');
  }

  // ─── Stopwatch logic ─────────────────────────────────────
  function swTick() {
    elapsed = Date.now() - startTime;
    render(elapsed);
  }

  // ─── Alarm: flash + 3 long beeps ────────────────────────
  function triggerAlarm() {
    // Flash screen 3 times
    const overlay = document.getElementById('flashOverlay');
    overlay.classList.remove('flashing');
    void overlay.offsetWidth; // reflow to restart animation
    overlay.classList.add('flashing');
    overlay.addEventListener('animationend', () => {
      overlay.classList.remove('flashing');
    }, { once: true });

    // 3 long beeps via Web Audio API
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const beepDuration = 0.7;   // seconds per beep
      const gap = 0.35;           // silence between beeps
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        const t = ctx.currentTime + i * (beepDuration + gap);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
        gain.gain.setValueAtTime(0.5, t + beepDuration - 0.05);
        gain.gain.linearRampToValueAtTime(0, t + beepDuration);
        osc.start(t);
        osc.stop(t + beepDuration);
      }
    } catch(e) { /* AudioContext not available */ }
  }

  // ─── Countdown logic ─────────────────────────────────────
  function cdTick() {
    elapsed = Date.now() - startTime;
    const remaining = cdTotal() - elapsed;

    if (remaining <= 0) {
      // Finished
      render(0);
      clearInterval(timerID);
      state = 'stopped';
      btnStart.textContent = 'START';
      btnStart.classList.remove('stop');
      setDigitClass('finished');
      sepEl.className = 'sep danger';
      statusEl.textContent = '⏰ tempo scaduto!';
      statusEl.className = 'status finished';
      elapsed = cdTotal(); // reset to full for next start
      triggerAlarm();
      return;
    }

    render(remaining);

    // Color warnings
    const secs = remaining / 1000;
    if (secs <= 10) {
      setDigitClass('danger');
    } else if (secs <= 30) {
      setDigitClass('warning');
    } else {
      setDigitClass('running');
    }
  }

  // ─── Controls ────────────────────────────────────────────
  function doStart() {
    state = 'running';
    if (mode === 'stopwatch') {
      startTime = Date.now() - elapsed;
      timerID = setInterval(swTick, 10);
      setDigitClass('running');
      msEl.style.display = '';
    } else {
      startTime = Date.now() - elapsed;
      timerID = setInterval(cdTick, 10);
      setDigitClass('running');
      msEl.style.display = 'none';
      setupEl.classList.remove('visible');
    }
    btnStart.textContent = 'STOP';
    btnStart.classList.add('stop');
    sepEl.className = 'sep';
    statusEl.textContent = '● in esecuzione';
    statusEl.className = 'status running';
  }

  function doStop() {
    state = 'stopped';
    clearInterval(timerID);
    btnStart.textContent = 'START';
    btnStart.classList.remove('stop');
    setDigitClass('');
    sepEl.className = 'sep paused';
    statusEl.textContent = '⏹ fermato';
    statusEl.className = 'status paused';
    if (mode === 'countdown') setupEl.classList.add('visible');
  }

  function doReset() {
    state = 'stopped';
    clearInterval(timerID);
    elapsed = 0;
    btnStart.textContent = 'START';
    btnStart.classList.remove('stop');
    setDigitClass('');
    sepEl.className = 'sep stopped';
    statusEl.textContent = '— pronto —';
    statusEl.className = 'status';

    if (mode === 'stopwatch') {
      render(0);
      msEl.style.display = '';
    } else {
      render(cdTotal());
      msEl.style.display = 'none';
      setupEl.classList.add('visible');
    }
  }

  btnStart.addEventListener('click', () => {
    if (mode === 'countdown' && state === 'stopped' && cdTotal() === 0) return;
    if (state === 'running') doStop();
    else doStart();
  });

  btnReset.addEventListener('click', doReset);

  // ─── Mode switch ─────────────────────────────────────────
  document.getElementById('btnModeStop').addEventListener('click', () => {
    if (mode === 'stopwatch') return;
    mode = 'stopwatch';
    document.getElementById('btnModeStop').classList.add('active');
    document.getElementById('btnModeCount').classList.remove('active');
    labelEl.textContent = 'Cronometro';
    setupEl.classList.remove('visible');
    doReset();
  });

  document.getElementById('btnModeCount').addEventListener('click', () => {
    if (mode === 'countdown') return;
    mode = 'countdown';
    document.getElementById('btnModeCount').classList.add('active');
    document.getElementById('btnModeStop').classList.remove('active');
    labelEl.textContent = 'Conto alla rovescia';
    elapsed = 0;
    setupEl.classList.add('visible');
    doReset();
  });

  // ─── Countdown time pickers ──────────────────────────────
  function updateCdDisplays() {
    cdMinDisp.textContent = pad(cdMinutes);
    cdSecDisp.textContent = pad(cdSeconds);
    if (state === 'stopped') render(cdTotal());
  }

  document.getElementById('minUp').addEventListener('click', () => {
    if (state === 'running') return;
    cdMinutes = Math.min(99, cdMinutes + 1);
    elapsed = 0;
    updateCdDisplays();
  });
  document.getElementById('minDown').addEventListener('click', () => {
    if (state === 'running') return;
    cdMinutes = Math.max(0, cdMinutes - 1);
    if (cdMinutes === 0 && cdSeconds === 0) cdSeconds = 1;
    elapsed = 0;
    updateCdDisplays();
  });
  document.getElementById('secUp').addEventListener('click', () => {
    if (state === 'running') return;
    cdSeconds = cdSeconds < 59 ? cdSeconds + 1 : 0;
    elapsed = 0;
    updateCdDisplays();
  });
  document.getElementById('secDown').addEventListener('click', () => {
    if (state === 'running') return;
    cdSeconds = cdSeconds > 0 ? cdSeconds - 1 : 59;
    if (cdMinutes === 0 && cdSeconds === 0) cdSeconds = 1;
    elapsed = 0;
    updateCdDisplays();
  });

  // ─── Init ─────────────────────────────────────────────────
  sepEl.className = 'sep stopped';
  render(0);
  msEl.style.display = '';
</script>
</body>
</html>
